<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>edgeViewLauncher</title>
    <script>
      // Prevent white flash: apply background before React mounts
      (function() {
        var t = localStorage.getItem('theme') || 'auto';
        var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.style.backgroundColor = dark ? '#0d1117' : '#f5f5f7';
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <style>html, body { margin: 0; padding: 0; background-color: inherit; }</style>
</head>
<body>
<div id="root"></div>
<script src="./src/main.jsx" type="module"></script>
</body>
</html>
