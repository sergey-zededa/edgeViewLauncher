<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="115" />
    </clipPath>

    <linearGradient id="zededaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7F32" />   <stop offset="100%" stop-color="#B02A1F" /> </linearGradient>

    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="hexGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="hexBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#4DE1C1" /> <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E28" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0.95" />
    </linearGradient>

    <filter id="warmDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4A0D03" flood-opacity="0.5" />
    </filter>
    
    <filter id="tealNeonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" /> <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#zededaBgGrad)" />
  
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="3" stroke-dasharray="8 12">
    <line x1="256" y1="256" x2="256" y2="20" />
    <line x1="256" y1="256" x2="50" y2="370" />
    <line x1="256" y1="256" x2="462" y2="370" />
  </g>

  <polygon points="256,100 386,175 386,337 256,412 126,337 126,175" 
           fill="url(#hexGlassGrad)" 
           stroke="url(#hexBorderGrad)" 
           stroke-width="6" 
           stroke-linejoin="round"
           filter="url(#warmDropShadow)" />

  <g filter="url(#warmDropShadow)">
    <rect x="156" y="180" width="200" height="152" rx="16" 
          fill="url(#terminalGrad)" 
          stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
    
    <g transform="translate(176, 200)">
      <circle cx="0" cy="0" r="5" fill="#FF5F56" opacity="0.9" />
      <circle cx="18" cy="0" r="5" fill="#FFBD2E" opacity="0.9" />
      <circle cx="36" cy="0" r="5" fill="#27C93F" opacity="0.9" />
    </g>

    <line x1="156" y1="220" x2="356" y2="220" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

    <g transform="translate(186, 276)" 
       stroke="#4DE1C1" 
       stroke-width="12" 
       stroke-linecap="round" 
       stroke-linejoin="round" 
       fill="none"
       filter="url(#tealNeonGlow)">
      <polyline points="0,-20 24,0 0,20" />
      <line x1="36" y1="24" x2="76" y2="24" />
    </g>
  </g>

  <path d="M0,0 L512,0 L512,256 C384,180 128,180 0,256 Z" fill="url(#glossGrad)" clip-path="url(#squircleClip)" style="mix-blend-mode: screen;" />

</svg>