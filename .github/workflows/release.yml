name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Cache Cargo and Tauri artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build Go backend (ARM64)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          GOOS=darwin GOARCH=arm64 go build -ldflags="-X 'main.Version=$VERSION'" -o src-tauri/binaries/edgeview-backend-aarch64-apple-darwin ./cmd/edgeview-backend

      - name: Build Go backend (x64)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          GOOS=darwin GOARCH=amd64 go build -ldflags="-X 'main.Version=$VERSION'" -o src-tauri/binaries/edgeview-backend-x86_64-apple-darwin ./cmd/edgeview-backend

      - name: Create universal Go backend binary
        run: lipo -create -output src-tauri/binaries/edgeview-backend-universal-apple-darwin src-tauri/binaries/edgeview-backend-aarch64-apple-darwin src-tauri/binaries/edgeview-backend-x86_64-apple-darwin

      - name: Generate build info
        run: node scripts/generate-build-info.js

      - name: Install x86_64 Rust target for universal build
        run: rustup target add x86_64-apple-darwin

      - name: Configure Apple code signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          A_ID: ${{ secrets.APPLE_ID }}
          A_PASS: ${{ secrets.APPLE_PASSWORD }}
          A_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ]; then
            echo "APPLE_CERTIFICATE<<EOCERT" >> $GITHUB_ENV
            echo "$CERT" >> $GITHUB_ENV
            echo "EOCERT" >> $GITHUB_ENV
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASS" >> $GITHUB_ENV
            echo "APPLE_SIGNING_IDENTITY=$SIGN_ID" >> $GITHUB_ENV
            echo "APPLE_ID=$A_ID" >> $GITHUB_ENV
            echo "APPLE_PASSWORD=$A_PASS" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=$A_TEAM" >> $GITHUB_ENV
            echo "Apple code signing configured"
          else
            echo "Apple code signing skipped (no certificate configured)"
          fi

      - name: Build Tauri app (macOS universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EdgeView Launcher ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      - name: Create Electron-compatible macOS bridge artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"

          # Create zip of .app bundle (electron-updater format)
          cd "$APP_DIR"
          ditto -c -k --sequesterRsrc --keepParent "EdgeView Launcher.app" "EdgeViewLauncher-${VERSION}-mac.zip"

          # Calculate SHA512 (base64-encoded, as electron-updater expects)
          SHA512=$(shasum -a 512 "EdgeViewLauncher-${VERSION}-mac.zip" | cut -f1 -d' ' | xxd -r -p | base64)
          SIZE=$(stat -f%z "EdgeViewLauncher-${VERSION}-mac.zip")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          # Generate latest-mac.yml
          cat > latest-mac.yml << EOYML
          version: ${VERSION}
          files:
            - url: EdgeViewLauncher-${VERSION}-mac.zip
              sha512: ${SHA512}
              size: ${SIZE}
          path: EdgeViewLauncher-${VERSION}-mac.zip
          sha512: ${SHA512}
          releaseDate: '${DATE}'
          EOYML

      - name: Save macOS updater signature
        run: |
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          SIG_FILE=$(ls "${BUNDLE_DIR}"/*.app.tar.gz.sig 2>/dev/null | head -1)
          if [ -n "$SIG_FILE" ]; then
            mkdir -p updater-sigs
            cp "$SIG_FILE" updater-sigs/macos.sig
            # Save the actual asset filename (GitHub replaces spaces with dots)
            ARCHIVE=$(ls "${BUNDLE_DIR}"/*.app.tar.gz 2>/dev/null | head -1)
            basename "$ARCHIVE" | tr ' ' '.' > updater-sigs/macos-filename.txt
            echo "Saved macOS updater signature"
          else
            echo "WARNING: No macOS .app.tar.gz.sig found"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/latest-mac.yml
            src-tauri/target/universal-apple-darwin/release/bundle/macos/EdgeViewLauncher-*-mac.zip
            updater-sigs/macos.sig
            updater-sigs/macos-filename.txt
          retention-days: 5

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Cache Cargo and Tauri artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build Go backend (Windows x64)
        run: |
          $VERSION = node -p "require('./package.json').version"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -ldflags="-X 'main.Version=$VERSION'" -o src-tauri\binaries\edgeview-backend-x86_64-pc-windows-msvc.exe ./cmd/edgeview-backend

      - name: Generate build info
        run: node scripts/generate-build-info.js

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EdgeView Launcher ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          args: --target x86_64-pc-windows-msvc

      - name: Create Electron-compatible Windows bridge manifest
        shell: pwsh
        run: |
          $VERSION = node -p "require('./package.json').version"
          $NSIS_DIR = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $EXE = Get-ChildItem "$NSIS_DIR/*.exe" | Select-Object -First 1
          $HASH = (Get-FileHash -Algorithm SHA512 $EXE.FullName).Hash
          # Convert hex SHA512 to base64 (electron-updater format)
          $BYTES = [byte[]]::new($HASH.Length / 2)
          for ($i = 0; $i -lt $HASH.Length; $i += 2) {
            $BYTES[$i/2] = [Convert]::ToByte($HASH.Substring($i, 2), 16)
          }
          $SHA512 = [Convert]::ToBase64String($BYTES)
          $SIZE = $EXE.Length
          $DATE = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.000Z")
          $FILENAME = $EXE.Name

          @"
          version: $VERSION
          files:
            - url: $FILENAME
              sha512: $SHA512
              size: $SIZE
          path: $FILENAME
          sha512: $SHA512
          releaseDate: '$DATE'
          "@ | Set-Content -Path "$NSIS_DIR/latest.yml" -Encoding utf8

      - name: Save Windows updater signature
        shell: pwsh
        run: |
          $NSIS_DIR = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $SIG = Get-ChildItem "$NSIS_DIR/*.nsis.zip.sig" | Select-Object -First 1
          if ($SIG) {
            New-Item -ItemType Directory -Force -Path updater-sigs | Out-Null
            Copy-Item $SIG.FullName "updater-sigs/windows.sig"
            $ARCHIVE = Get-ChildItem "$NSIS_DIR/*.nsis.zip" | Select-Object -First 1
            $ARCHIVE.Name.Replace(' ', '.') | Set-Content "updater-sigs/windows-filename.txt" -NoNewline
            Write-Output "Saved Windows updater signature"
          } else {
            Write-Output "WARNING: No Windows .nsis.zip.sig found"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/latest.yml
            updater-sigs/windows.sig
            updater-sigs/windows-filename.txt
          retention-days: 5

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Tauri System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Cache Cargo and Tauri artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build Go backend (Linux x64)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          GOOS=linux GOARCH=amd64 go build -ldflags="-X 'main.Version=$VERSION'" -o src-tauri/binaries/edgeview-backend-x86_64-unknown-linux-gnu ./cmd/edgeview-backend

      - name: Generate build info
        run: node scripts/generate-build-info.js

      - name: Build Tauri app (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EdgeView Launcher ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          args: --target x86_64-unknown-linux-gnu

      - name: Create Electron-compatible Linux bridge manifest
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APPIMAGE_DIR="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage"
          APPIMAGE=$(ls ${APPIMAGE_DIR}/*.AppImage | head -1)
          FILENAME=$(basename "$APPIMAGE")
          SHA512=$(sha512sum "$APPIMAGE" | cut -f1 -d' ' | xxd -r -p | base64 -w0)
          SIZE=$(stat --printf="%s" "$APPIMAGE")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          cat > "${APPIMAGE_DIR}/latest-linux.yml" << EOYML
          version: ${VERSION}
          files:
            - url: ${FILENAME}
              sha512: ${SHA512}
              size: ${SIZE}
          path: ${FILENAME}
          sha512: ${SHA512}
          releaseDate: '${DATE}'
          EOYML

      - name: Save Linux updater signature
        run: |
          APPIMAGE_DIR="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage"
          SIG_FILE=$(ls "${APPIMAGE_DIR}"/*.AppImage.tar.gz.sig 2>/dev/null | head -1)
          if [ -n "$SIG_FILE" ]; then
            mkdir -p updater-sigs
            cp "$SIG_FILE" updater-sigs/linux.sig
            ARCHIVE=$(ls "${APPIMAGE_DIR}"/*.AppImage.tar.gz 2>/dev/null | head -1)
            basename "$ARCHIVE" | tr ' ' '.' > updater-sigs/linux-filename.txt
            echo "Saved Linux updater signature"
          else
            echo "WARNING: No Linux .AppImage.tar.gz.sig found"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz.sig
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/latest-linux.yml
            updater-sigs/linux.sig
            updater-sigs/linux-filename.txt
          retention-days: 5

  release:
    name: Create Release
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Generate latest.json for Tauri updater
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.ref_name }}"
          REPO="sergey-zededa/edgeViewLauncher"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read per-platform signatures and filenames into files for Node
          echo -n "" > /tmp/mac_sig.txt
          echo -n "" > /tmp/mac_url.txt
          echo -n "" > /tmp/win_sig.txt
          echo -n "" > /tmp/win_url.txt
          echo -n "" > /tmp/linux_sig.txt
          echo -n "" > /tmp/linux_url.txt

          if [ -f artifacts/macos/updater-sigs/macos.sig ]; then
            cp artifacts/macos/updater-sigs/macos.sig /tmp/mac_sig.txt
            MAC_FILENAME=$(cat artifacts/macos/updater-sigs/macos-filename.txt)
            echo -n "https://github.com/${REPO}/releases/download/${TAG}/${MAC_FILENAME}" > /tmp/mac_url.txt
            echo "macOS: ${MAC_FILENAME}"
          fi

          if [ -f artifacts/windows-x64/updater-sigs/windows.sig ]; then
            cp artifacts/windows-x64/updater-sigs/windows.sig /tmp/win_sig.txt
            WIN_FILENAME=$(cat artifacts/windows-x64/updater-sigs/windows-filename.txt)
            echo -n "https://github.com/${REPO}/releases/download/${TAG}/${WIN_FILENAME}" > /tmp/win_url.txt
            echo "Windows: ${WIN_FILENAME}"
          fi

          if [ -f artifacts/linux-x64/updater-sigs/linux.sig ]; then
            cp artifacts/linux-x64/updater-sigs/linux.sig /tmp/linux_sig.txt
            LINUX_FILENAME=$(cat artifacts/linux-x64/updater-sigs/linux-filename.txt)
            echo -n "https://github.com/${REPO}/releases/download/${TAG}/${LINUX_FILENAME}" > /tmp/linux_url.txt
            echo "Linux: ${LINUX_FILENAME}"
          fi

          # Build latest.json using node for proper JSON encoding
          node -e "
            const fs = require('fs');
            const read = (f) => fs.readFileSync(f, 'utf8').trim();
            const json = {
              version: '${VERSION}',
              notes: 'See release notes on GitHub',
              pub_date: '${DATE}',
              platforms: {}
            };
            const macSig = read('/tmp/mac_sig.txt');
            const macUrl = read('/tmp/mac_url.txt');
            const winSig = read('/tmp/win_sig.txt');
            const winUrl = read('/tmp/win_url.txt');
            const linuxSig = read('/tmp/linux_sig.txt');
            const linuxUrl = read('/tmp/linux_url.txt');
            if (macSig && macUrl) {
              json.platforms['darwin-universal'] = { signature: macSig, url: macUrl };
              json.platforms['darwin-aarch64'] = { signature: macSig, url: macUrl };
              json.platforms['darwin-x86_64'] = { signature: macSig, url: macUrl };
            }
            if (winSig && winUrl) {
              json.platforms['windows-x86_64'] = { signature: winSig, url: winUrl };
            }
            if (linuxSig && linuxUrl) {
              json.platforms['linux-x86_64'] = { signature: linuxSig, url: linuxUrl };
            }
            console.log(JSON.stringify(json, null, 2));
          " > artifacts/latest.json
          echo "Generated latest.json:"
          cat artifacts/latest.json

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            artifacts/macos/macos/*
            artifacts/macos/dmg/*
            artifacts/windows-x64/nsis/*
            artifacts/windows-x64/*
            artifacts/linux-x64/appimage/*
            artifacts/linux-x64/deb/*
            artifacts/latest.json
          generateReleaseNotes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
          allowUpdates: true
          removeArtifacts: false
          token: ${{ secrets.GITHUB_TOKEN }}
