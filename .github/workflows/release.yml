name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Cache Cargo and Tauri artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build Go backend (ARM64)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          GOOS=darwin GOARCH=arm64 go build -ldflags="-X 'main.Version=$VERSION'" -o src-tauri/binaries/edgeview-backend-aarch64-apple-darwin ./cmd/edgeview-backend

      - name: Build Go backend (x64)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          GOOS=darwin GOARCH=amd64 go build -ldflags="-X 'main.Version=$VERSION'" -o src-tauri/binaries/edgeview-backend-x86_64-apple-darwin ./cmd/edgeview-backend

      - name: Create universal Go backend binary
        run: lipo -create -output src-tauri/binaries/edgeview-backend-universal-apple-darwin src-tauri/binaries/edgeview-backend-aarch64-apple-darwin src-tauri/binaries/edgeview-backend-x86_64-apple-darwin

      - name: Generate build info
        run: node scripts/generate-build-info.js

      - name: Install x86_64 Rust target for universal build
        run: rustup target add x86_64-apple-darwin

      - name: Configure Apple code signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          A_ID: ${{ secrets.APPLE_ID }}
          A_PASS: ${{ secrets.APPLE_PASSWORD }}
          A_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ]; then
            echo "APPLE_CERTIFICATE<<EOCERT" >> $GITHUB_ENV
            echo "$CERT" >> $GITHUB_ENV
            echo "EOCERT" >> $GITHUB_ENV
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASS" >> $GITHUB_ENV
            echo "APPLE_SIGNING_IDENTITY=$SIGN_ID" >> $GITHUB_ENV
            echo "APPLE_ID=$A_ID" >> $GITHUB_ENV
            echo "APPLE_PASSWORD=$A_PASS" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=$A_TEAM" >> $GITHUB_ENV
            echo "Apple code signing configured"
          else
            echo "Apple code signing skipped (no certificate configured)"
          fi

      - name: Build Tauri app (macOS universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EdgeView Launcher ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      - name: Create Electron bridge artifacts and updater info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          cd "$APP_DIR"

          # Create zip of .app bundle (electron-updater format)
          ditto -c -k --sequesterRsrc --keepParent "EdgeView Launcher.app" "EdgeViewLauncher-${VERSION}-mac.zip"

          # Calculate SHA512 (base64-encoded, as electron-updater expects)
          SHA512=$(shasum -a 512 "EdgeViewLauncher-${VERSION}-mac.zip" | cut -f1 -d' ' | xxd -r -p | base64)
          SIZE=$(stat -f%z "EdgeViewLauncher-${VERSION}-mac.zip")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          # Generate latest-mac.yml (Electron bridge manifest)
          cat > latest-mac.yml << EOYML
          version: ${VERSION}
          files:
            - url: EdgeViewLauncher-${VERSION}-mac.zip
              sha512: ${SHA512}
              size: ${SIZE}
          path: EdgeViewLauncher-${VERSION}-mac.zip
          sha512: ${SHA512}
          releaseDate: '${DATE}'
          EOYML

          # Save updater signature for latest.json generation
          SIG_FILE=$(ls *.app.tar.gz.sig 2>/dev/null | head -1)
          ARCHIVE=$(ls *.app.tar.gz 2>/dev/null | head -1)
          if [ -n "$SIG_FILE" ] && [ -n "$ARCHIVE" ]; then
            cp "$SIG_FILE" updater-sig.txt
            basename "$ARCHIVE" | tr ' ' '.' > updater-filename.txt
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: src-tauri/target/universal-apple-darwin/release/bundle
          retention-days: 5

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Cache Cargo and Tauri artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build Go backend (Windows x64)
        run: |
          $VERSION = node -p "require('./package.json').version"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -ldflags="-X 'main.Version=$VERSION'" -o src-tauri\binaries\edgeview-backend-x86_64-pc-windows-msvc.exe ./cmd/edgeview-backend

      - name: Generate build info
        run: node scripts/generate-build-info.js

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EdgeView Launcher ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          args: --target x86_64-pc-windows-msvc

      - name: Create Electron bridge manifest and updater info
        shell: pwsh
        run: |
          $VERSION = node -p "require('./package.json').version"
          $NSIS_DIR = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"

          # Electron bridge manifest
          $EXE = Get-ChildItem "$NSIS_DIR/*.exe" | Select-Object -First 1
          $HASH = (Get-FileHash -Algorithm SHA512 $EXE.FullName).Hash
          $BYTES = [byte[]]::new($HASH.Length / 2)
          for ($i = 0; $i -lt $HASH.Length; $i += 2) {
            $BYTES[$i/2] = [Convert]::ToByte($HASH.Substring($i, 2), 16)
          }
          $SHA512 = [Convert]::ToBase64String($BYTES)
          $SIZE = $EXE.Length
          $DATE = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.000Z")
          $FILENAME = $EXE.Name

          @"
          version: $VERSION
          files:
            - url: $FILENAME
              sha512: $SHA512
              size: $SIZE
          path: $FILENAME
          sha512: $SHA512
          releaseDate: '$DATE'
          "@ | Set-Content -Path "$NSIS_DIR/latest.yml" -Encoding utf8

          # Save updater signature
          $SIG = Get-ChildItem "$NSIS_DIR/*.nsis.zip.sig" | Select-Object -First 1
          $ARCHIVE = Get-ChildItem "$NSIS_DIR/*.nsis.zip" -Exclude "*.sig" | Select-Object -First 1
          if ($SIG -and $ARCHIVE) {
            Copy-Item $SIG.FullName "$NSIS_DIR/updater-sig.txt"
            $ARCHIVE.Name.Replace(' ', '.') | Set-Content "$NSIS_DIR/updater-filename.txt" -NoNewline
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          retention-days: 5

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Tauri System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Cache Cargo and Tauri artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build Go backend (Linux x64)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          GOOS=linux GOARCH=amd64 go build -ldflags="-X 'main.Version=$VERSION'" -o src-tauri/binaries/edgeview-backend-x86_64-unknown-linux-gnu ./cmd/edgeview-backend

      - name: Generate build info
        run: node scripts/generate-build-info.js

      - name: Build Tauri app (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EdgeView Launcher ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          args: --target x86_64-unknown-linux-gnu

      - name: Create Electron bridge manifest and updater info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APPIMAGE_DIR="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage"
          APPIMAGE=$(ls ${APPIMAGE_DIR}/*.AppImage 2>/dev/null | head -1)
          FILENAME=$(basename "$APPIMAGE")
          SHA512=$(sha512sum "$APPIMAGE" | cut -f1 -d' ' | xxd -r -p | base64 -w0)
          SIZE=$(stat --printf="%s" "$APPIMAGE")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          cat > "${APPIMAGE_DIR}/latest-linux.yml" << EOYML
          version: ${VERSION}
          files:
            - url: ${FILENAME}
              sha512: ${SHA512}
              size: ${SIZE}
          path: ${FILENAME}
          sha512: ${SHA512}
          releaseDate: '${DATE}'
          EOYML

          # Save updater signature
          SIG_FILE=$(ls ${APPIMAGE_DIR}/*.AppImage.tar.gz.sig 2>/dev/null | head -1)
          ARCHIVE=$(ls ${APPIMAGE_DIR}/*.AppImage.tar.gz 2>/dev/null | grep -v '\.sig$' | head -1)
          if [ -n "$SIG_FILE" ] && [ -n "$ARCHIVE" ]; then
            cp "$SIG_FILE" "${APPIMAGE_DIR}/updater-sig.txt"
            basename "$ARCHIVE" | tr ' ' '.' > "${APPIMAGE_DIR}/updater-filename.txt"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb
          retention-days: 5

  release:
    name: Create Release
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: find artifacts -type f | sort

      - name: Generate latest.json for Tauri updater
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.ref_name }}"
          REPO="sergey-zededa/edgeViewLauncher"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Find updater signature files
          MAC_SIG_FILE=$(find artifacts/macos -name "updater-sig.txt" 2>/dev/null | head -1)
          MAC_NAME_FILE=$(find artifacts/macos -name "updater-filename.txt" 2>/dev/null | head -1)
          WIN_SIG_FILE=$(find artifacts/windows-x64 -name "updater-sig.txt" 2>/dev/null | head -1)
          WIN_NAME_FILE=$(find artifacts/windows-x64 -name "updater-filename.txt" 2>/dev/null | head -1)
          LINUX_SIG_FILE=$(find artifacts/linux-x64 -name "updater-sig.txt" 2>/dev/null | head -1)
          LINUX_NAME_FILE=$(find artifacts/linux-x64 -name "updater-filename.txt" 2>/dev/null | head -1)

          # Write sig contents to fixed paths for Node to read
          for p in mac win linux; do
            echo -n "" > /tmp/${p}_sig.txt
            echo -n "" > /tmp/${p}_url.txt
          done

          if [ -n "$MAC_SIG_FILE" ] && [ -n "$MAC_NAME_FILE" ]; then
            cp "$MAC_SIG_FILE" /tmp/mac_sig.txt
            FNAME=$(cat "$MAC_NAME_FILE")
            echo -n "https://github.com/${REPO}/releases/download/${TAG}/${FNAME}" > /tmp/mac_url.txt
            echo "macOS updater: ${FNAME}"
          fi

          if [ -n "$WIN_SIG_FILE" ] && [ -n "$WIN_NAME_FILE" ]; then
            cp "$WIN_SIG_FILE" /tmp/win_sig.txt
            FNAME=$(cat "$WIN_NAME_FILE")
            echo -n "https://github.com/${REPO}/releases/download/${TAG}/${FNAME}" > /tmp/win_url.txt
            echo "Windows updater: ${FNAME}"
          fi

          if [ -n "$LINUX_SIG_FILE" ] && [ -n "$LINUX_NAME_FILE" ]; then
            cp "$LINUX_SIG_FILE" /tmp/linux_sig.txt
            FNAME=$(cat "$LINUX_NAME_FILE")
            echo -n "https://github.com/${REPO}/releases/download/${TAG}/${FNAME}" > /tmp/linux_url.txt
            echo "Linux updater: ${FNAME}"
          fi

          node -e "
            const fs = require('fs');
            const read = (f) => { try { return fs.readFileSync(f, 'utf8').trim(); } catch { return ''; } };
            const json = {
              version: '${VERSION}',
              notes: 'See release notes on GitHub',
              pub_date: '${DATE}',
              platforms: {}
            };
            const macSig = read('/tmp/mac_sig.txt');
            const macUrl = read('/tmp/mac_url.txt');
            const winSig = read('/tmp/win_sig.txt');
            const winUrl = read('/tmp/win_url.txt');
            const linuxSig = read('/tmp/linux_sig.txt');
            const linuxUrl = read('/tmp/linux_url.txt');
            if (macSig && macUrl) {
              json.platforms['darwin-universal'] = { signature: macSig, url: macUrl };
              json.platforms['darwin-aarch64'] = { signature: macSig, url: macUrl };
              json.platforms['darwin-x86_64'] = { signature: macSig, url: macUrl };
            }
            if (winSig && winUrl) {
              json.platforms['windows-x86_64'] = { signature: winSig, url: winUrl };
            }
            if (linuxSig && linuxUrl) {
              json.platforms['linux-x86_64'] = { signature: linuxSig, url: linuxUrl };
            }
            fs.writeFileSync('artifacts/latest.json', JSON.stringify(json, null, 2));
            console.log(JSON.stringify(json, null, 2));
          "

      - name: Collect release files
        run: |
          mkdir -p release-assets
          # Find all uploadable files (skip directories, updater temp files)
          find artifacts -type f \
            ! -name "updater-sig.txt" \
            ! -name "updater-filename.txt" \
            ! -name "*.sig" \
            -exec cp {} release-assets/ \;
          echo "Files to upload:"
          ls -la release-assets/

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-assets/*"
          generateReleaseNotes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
          allowUpdates: true
          removeArtifacts: false
          token: ${{ secrets.GITHUB_TOKEN }}
