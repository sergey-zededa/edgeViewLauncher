name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend tests
        run: cd frontend && npm test -- --run

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Go backend (verify compilation)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          go build -ldflags="-X main.Version=$VERSION" -o src-tauri/binaries/edgeview-backend-x86_64-unknown-linux-gnu ./cmd/edgeview-backend

      - name: Install Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust tests
        run: cd src-tauri && cargo test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Go vet
        run: go vet ./...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Check for TypeScript/JavaScript issues
        run: cd frontend && npx tsc --noEmit 2>/dev/null || true

  security-go:
    name: Go Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        continue-on-error: true
        run: govulncheck ./...

  security-npm:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit root dependencies
        run: npm audit --audit-level=high || true

      - name: Install and audit frontend dependencies
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high || true

  codeql:
    name: CodeQL Analysis
    if: false # Disabled for private repo to avoid billing; enable when public
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go, javascript
          # Removed build-mode: autobuild to avoid JS/TS conflict

      # Removed manual build step for CodeQL since autobuild is used
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
