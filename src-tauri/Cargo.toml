[package]
name = "edgeview-launcher"
version = "0.2.0"
description = "EdgeView Launcher – desktop client for ZEDEDA edge devices"
authors = ["ZEDEDA <support@zededa.com>"]
edition = "2021"

[lib]
name = "edgeview_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "edgeview-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json  = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell   = "2"
tauri-plugin-dialog  = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener  = "2"
tauri-plugin-process = "2"

serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
reqwest      = { version = "0.12", features = ["json", "stream"] }
keyring      = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs-next    = "2"
futures-util = "0.3"

[dev-dependencies]
mockito     = "1"
tempfile    = "3"

[profile.release]
opt-level  = "z"
lto        = true
codegen-units = 1
panic     = "abort"
strip     = true
